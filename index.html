<!DOCTYPE html>
<html>
<head>
    <title>P7 News</title>
    <style>
        img{
        /* max-width:60%;
        height: fit-content; */
        display:block;
        }       
        body{
            font-family:Arial;
            margin:20px;
        }
        header{
            text-align:center;
            border-bottom:2px solid black;
            padding:10px;
        }
        .news{
            display:grid;
            grid-template-columns:1fr 2fr 1fr;
            gap:20px;
            margin-top:20px;
        }
        article{
            border:1px solid #ccc;
            padding:15px;
        }
        img{
            width:100%;
        }
        h1{
            font-size:35px;
        }
        h2{
            margin-top:0;
        }
    </style>
</head>
<body>
<header>
    <h1>Blahaj news</h1>
    <p>Thursday, October 1, 2026</p>
</header>
<div class="news">
    <article>
        <h2>Side News</h2>
        <img src=music.jpg alt="bahaj listening to music">
        <p>Blahaj liked the new mili song.</p>
        <hr>
        <img src=Me.jpg alt="bahaj listening to music">
        <p>Blahaj cracked JEE, Neet, CUET and UPSC all together.</p>
    </article>
    <article>
        <h2>Main Headline</h2>
        <img src="gaming.jpg" alt="blahaj gaming">
        <p>Blahaj beat long nose in valorant.</p>
    </article>
    <article>
        <h2>Latest News</h2>
        <p>Blahaj running for presidency</p>
        <p>Blahaj on sale for students!!!</p>
        <p>Blahaj cured cancer</p>
    </article>
</div>
</body>
</html>
